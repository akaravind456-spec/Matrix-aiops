AWSTemplateFormatVersion: '2010-09-09'
Description: MATRIX console frontend on an S3 static website (HTTP). Add CloudFront later for HTTPS.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique name, e.g. matrix-console-<account-id>-ap-southeast-2

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: ['*']

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*

Outputs:
  WebsiteURL:
    Value: !GetAtt SiteBucket.WebsiteURL
  Reminder:
    Value: Set the Lambda Function URL CORS AllowOrigins to the WebsiteURL, then upload index.html to the bucket.
