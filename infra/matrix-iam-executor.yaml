AWSTemplateFormatVersion: '2010-09-09'
Description: MATRIX agent - scoped executor role (one stack per environment), EC2 SSM instance profile, service-action SSM doc, audit log

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Role can only touch instances tagged environment=<this value>
  TrustedLambdaRoleArn:
    Type: String
    Description: ARN of the existing MATRIX console Lambda execution role (it assumes the executor role)
  EnableDecommissionRole:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: 'true creates a second role that can terminate instances, but only ones a human has tagged decommission-approved=true. Leave false unless you want the agent to terminate.'

Conditions:
  DecomEnabled: !Equals [!Ref EnableDecommissionRole, 'true']

Resources:
  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /matrix/executor-audit-${Environment}
      RetentionInDays: 365

  # Role that EC2 instances launched by the agent use, so SSM can manage them
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub matrix-instance-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub matrix-instance-profile-${Environment}
      Roles: [!Ref InstanceRole]

  # The role the agent assumes to run engineer-requested commands
  ExecutorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub matrix-executor-${Environment}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref TrustedLambdaRoleArn }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: matrix-executor-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # --- run commands, only on managed instances in this environment ---
              - Sid: SendCommandToTaggedInstances
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/matrix-managed: 'true'
                    ssm:resourceTag/environment: !Ref Environment
              - Sid: SendCommandDocuments
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunPatchBaseline
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/MATRIX_*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/NGINX_*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/KILL_PID
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/CPU_DIAGNOSTICS
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/DISK_*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/PROCESS_DETAILS
              - Sid: ReadCommandResults
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:ListCommands
                  - ssm:DescribeInstanceInformation
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeImages
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVolumes
                Resource: '*'
              - Sid: ReadObservability
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmHistory
                  - logs:DescribeLogGroups
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - cloudtrail:LookupEvents
                  - ec2:DescribeAddresses
                  - ec2:DescribeSnapshots
                  - ec2:DescribeNetworkInterfaces
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeLoadBalancers
                Resource: '*'
              - Sid: SnapshotTaggedVolumes
                Effect: Allow
                Action: ec2:CreateSnapshot
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:${AWS::Region}::snapshot/*
              - Sid: ReadLatestAmiParameter
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}::parameter/aws/service/ami-amazon-linux-latest/*
              # --- start / stop / reboot, tagged instances in this environment only ---
              - Sid: PowerActions
                Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances, ec2:RebootInstances]
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/matrix-managed: 'true'
                    aws:ResourceTag/environment: !Ref Environment
              # --- launch instances: approved types only, tags mandatory ---
              - Sid: RunInstancesOnInstance
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:RequestTag/matrix-managed: 'true'
                    aws:RequestTag/environment: !Ref Environment
                  'Null':
                    aws:RequestTag/change: 'false'
              - Sid: RunInstancesSupportingResources
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:${AWS::Region}::image/*
              # --- backup images for patching, migration and decommission (no reboot), tagged instances only ---
              - Sid: CreateImageOfTaggedInstances
                Effect: Allow
                Action: ec2:CreateImage
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/matrix-managed: 'true'
                    aws:ResourceTag/environment: !Ref Environment
              - Sid: CreateImageOutputs
                Effect: Allow
                Action: ec2:CreateImage
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}::image/*
                  - !Sub arn:aws:ec2:${AWS::Region}::snapshot/*
                Condition:
                  StringEquals:
                    aws:RequestTag/matrix-managed: 'true'
                    aws:RequestTag/environment: !Ref Environment
                  'Null':
                    aws:RequestTag/change: 'false'
              # copy a migration image into another region (the same role must be created there too, see docs/deployment-guide.md)
              - Sid: CopyImage
                Effect: Allow
                Action: ec2:CopyImage
                Resource: !Sub arn:aws:ec2:${AWS::Region}::image/*
              # move an Elastic IP during migration cutover and rollback
              - Sid: MoveElasticIp
                Effect: Allow
                Action: [ec2:AssociateAddress, ec2:DisassociateAddress]
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/matrix-managed: 'true'
                    aws:ResourceTag/environment: !Ref Environment
              - Sid: MoveElasticIpResources
                Effect: Allow
                Action: [ec2:AssociateAddress, ec2:DisassociateAddress]
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
              - Sid: TagOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:*/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: [RunInstances, CreateImage, CopyImage, CreateSnapshot]
              - Sid: TagImagesOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}::image/*
                  - !Sub arn:aws:ec2:${AWS::Region}::snapshot/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: [CreateImage, CopyImage, CreateSnapshot]
              - Sid: PassInstanceRoleOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt InstanceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Sid: WriteAudit
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${AuditLogGroup.Arn}:*
              # --- hard stops, cannot be overridden by anything above ---
              - Sid: NeverAllow
                Effect: Deny
                Action:
                  - iam:*
                  - organizations:*
                  - account:*
                  - ec2:TerminateInstances
                  - ec2:DeleteVolume
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:ModifyInstanceAttribute
                  - kms:ScheduleKeyDeletion
                  - s3:DeleteBucket
                  - rds:DeleteDBInstance
                Resource: '*'
              # permission boundary on PassRole above; explicit deny of passing any other role
              - Sid: DenyPassOtherRoles
                Effect: Deny
                Action: iam:PassRole
                NotResource: !GetAtt InstanceRole.Arn

  # Optional: the ONLY way the agent can terminate. The main executor role keeps its hard deny on TerminateInstances.
  # Works only on instances that are matrix-managed, in this environment, AND tagged decommission-approved=true by a human.
  DecommissionRole:
    Type: AWS::IAM::Role
    Condition: DecomEnabled
    Properties:
      RoleName: !Sub matrix-decommission-${Environment}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref TrustedLambdaRoleArn }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: matrix-decommission-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TerminateApprovedInstancesOnly
                Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/matrix-managed: 'true'
                    aws:ResourceTag/environment: !Ref Environment
                    aws:ResourceTag/decommission-approved: 'true'
              - Sid: Describe
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'

  # Structured service control, no free-form shell needed for start/stop/restart
  ServiceActionDoc:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_SERVICE_ACTION
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: Start, stop, restart or check a systemd service (allowlisted names only)
        parameters:
          ServiceName:
            type: String
            allowedPattern: '^(nginx|httpd|amazon-cloudwatch-agent|amazon-ssm-agent|crond|chronyd|sshd|docker|mysqld|postgresql|rsyslog)$'
          Action:
            type: String
            allowedValues: [start, stop, restart, status]
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'systemctl {{ Action }} {{ ServiceName }}'
                - 'systemctl is-active {{ ServiceName }} || true'

Outputs:
  ExecutorRoleArn:
    Value: !GetAtt ExecutorRole.Arn
  InstanceProfileName:
    Value: !Ref InstanceProfile
  AuditLogGroupName:
    Value: !Ref AuditLogGroup
  DecommissionRoleArn:
    Condition: DecomEnabled
    Value: !GetAtt DecommissionRole.Arn
    Description: Put this in the Lambda variable DECOMMISSION_ROLE_ARN to let the agent terminate approved instances
