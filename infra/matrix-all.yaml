AWSTemplateFormatVersion: '2010-09-09'
Description: MATRIX complete stack - tables, buckets, Lambda role, scoped executor role, SSM playbooks, the console Lambda, its Function URL and the learning schedule. One template, one form.
# GENERATED by tools/build-all-template.py from the separate templates in this folder. Edit those, then re-run the script.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Code (create this bucket and upload the zip first) }
        Parameters: [CodeBucket, CodeKey, FunctionName, Environment, WebsiteUrl]
      - Label: { default: ServiceNow }
        Parameters: [SnBase, SnUser, SnPass, SnAiUser, SnAiGroup, SnL2Group, SnL3Group, L1Group, L2Group]
      - Label: { default: Sign-in }
        Parameters: [TokenSecret, UsersJson, LeadRoles, AgentKey]
      - Label: { default: LLM primary }
        Parameters: [LlmUrl, LlmApiKey, LlmModel, LlmSmallModel, LlmExtraModels]
      - Label: { default: LLM standby 1 }
        Parameters: [Fb1Url, Fb1Key, Fb1Model]
      - Label: { default: LLM standby 2 }
        Parameters: [Fb2Url, Fb2Key, Fb2Model]
      - Label: { default: LLM standby 3 }
        Parameters: [Fb3Url, Fb3Key, Fb3Model]
      - Label: { default: AWS operations }
        Parameters: [ReadAccess, OperatorRoleArn, EnableDecommissionRole, SubnetId, SecurityGroupId, MaxVcpu, AllowedTypes, Services, IngestUrl, TfProject, TfModules, Playbooks]
      - Label: { default: Agent behaviour }
        Parameters: [KbName, LlmPrices, AutoAfter, Families, RagMin, RagRequired, LearnScan, EvalHost]

Parameters:
  CodeBucket:
    Type: String
    Description: Name of an S3 bucket you created by hand, with matrix-lambda.zip already uploaded to it
  CodeKey:
    Type: String
    Default: matrix-lambda.zip
    Description: Key of the zip you uploaded to that bucket
  FunctionName:
    Type: String
    Default: matrix-console-api
    Description: Name the app stack will give the Lambda. The role is scoped to this name, so keep both the same.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Role can only touch instances tagged environment=<this value>
  WebsiteUrl:
    Type: String
    Default: '*'
    Description: Origin allowed to call the Function URL. Keep * when you open matrix-ui.html from your PC. Use your website address if you host the page in S3.
  ReadAccess:
    Type: String
    Default: ViewOnlyAccess
    AllowedValues: [ViewOnlyAccess, ReadOnlyAccess, None]
    Description: AWS managed policy behind the chat tool aws_read (reports, finding resource ids). ViewOnlyAccess is narrower. The code blocks reading secrets and data either way.
  OperatorRoleArn:
    Type: String
    Default: ''
    Description: Optional. ARN of an existing operator role for the chat tool aws_write. Leave empty to keep aws_write switched off.
  EnableDecommissionRole:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: 'true creates a second role that can terminate instances, but only ones a human has tagged decommission-approved=true. Leave false unless you want the agent to terminate.'

  SnBase:
    Type: String
    Description: https://devXXXXXX.service-now.com with no path and no trailing slash
  SnUser:
    Type: String
  SnPass:
    Type: String
    NoEcho: true
  SnAiUser:
    Type: String
    Default: matrix.ai
  SnAiGroup:
    Type: String
    Default: MATRIX-AI-L1
  SnL2Group:
    Type: String
    Default: MATRIX-L2
  SnL3Group:
    Type: String
    Default: MATRIX-L3
  L1Group:
    Type: String
    Default: MATRIX-AI-L1
  L2Group:
    Type: String
    Default: L2 Cloud Engineers

  TokenSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Generate a NEW random value of 32+ characters. Do not reuse the source account's.
  UsersJson:
    Type: String
    NoEcho: true
    Default: '[]'
    Description: The same USERS JSON the source Lambda uses (sign-in accounts). Re-create passwords where you can.
  LeadRoles:
    Type: String
    Default: L2 lead,lead,admin
  AgentKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: NEW random value for the autonomous agent's internal key

  LlmUrl:
    Type: String
    Default: https://integrate.api.nvidia.com/v1/chat/completions
  LlmApiKey:
    Type: String
    NoEcho: true
    Description: Primary LLM key (NVIDIA nvapi-...)
  LlmModel:
    Type: String
    Description: Exact model ID from the provider's model page. Must support tool calling.
  LlmSmallModel:
    Type: String
    Default: ''
  LlmExtraModels:
    Type: String
    Default: ''
    Description: Comma list of extra models on the same provider and key
  Fb1Url:
    Type: String
    Default: https://api.groq.com/openai/v1/chat/completions
  Fb1Key:
    Type: String
    NoEcho: true
    Default: ''
  Fb1Model:
    Type: String
    Default: ''
  Fb2Url:
    Type: String
    Default: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
  Fb2Key:
    Type: String
    NoEcho: true
    Default: ''
  Fb2Model:
    Type: String
    Default: ''
  Fb3Url:
    Type: String
    Default: https://openrouter.ai/api/v1/chat/completions
  Fb3Key:
    Type: String
    NoEcho: true
    Default: ''
  Fb3Model:
    Type: String
    Default: ''
  SubnetId:
    Type: String
    Default: ''
    Description: Subnet for servers the agent deploys
  SecurityGroupId:
    Type: String
    Default: ''
  MaxVcpu:
    Type: Number
    Default: 0
    Description: 0 means no cap on server size
  AllowedTypes:
    Type: String
    Default: t3.micro,t3.small,t3.medium
  Services:
    Type: String
    Default: nginx,httpd,crond
  IngestUrl:
    Type: String
    Default: ''
    Description: Alarm ingest webhook, if you use one (see docs/deployment-guide.md)
  TfProject:
    Type: String
    Default: ''
  TfModules:
    Type: String
    Default: ''
  Playbooks:
    Type: String
    Default: ''

  KbName:
    Type: String
    Default: AI SRE Runbooks
    Description: ServiceNow knowledge base that SOPs and runbooks uploaded in the console go to. It must already exist.
  LlmPrices:
    Type: String
    Default: ''
    Description: 'Optional JSON of LLM prices in USD per 1M tokens, for example {"openai/gpt-oss-120b":{"in":0.15,"out":0.60}}. Built-in defaults cover NVIDIA free endpoints and two Groq models.'
  AutoAfter:
    Type: Number
    Default: 3
  Families:
    Type: String
    Default: m5,m6i,t3
  RagMin:
    Type: String
    Default: '0.5'
  RagRequired:
    Type: String
    Default: '1'
    AllowedValues: ['0', '1']
  LearnScan:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Set DISABLED while the old account's agent is still running against the same ServiceNow
  EvalHost:
    Type: String
    Default: matrix-linux-01

Conditions:
  AttachViewOnly: !Equals [!Ref ReadAccess, ViewOnlyAccess]
  AttachReadOnly: !Equals [!Ref ReadAccess, ReadOnlyAccess]
  HasOperatorRole: !Not [!Equals [!Ref OperatorRoleArn, '']]
  DecomEnabled: !Equals [!Ref EnableDecommissionRole, 'true']

Resources:
  Projects:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: matrix-projects
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: project_id, AttributeType: S}]
      KeySchema: [{AttributeName: project_id, KeyType: HASH}]

  Sessions:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: matrix-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: user_id, AttributeType: S}, {AttributeName: session_id, AttributeType: S}]
      KeySchema: [{AttributeName: user_id, KeyType: HASH}, {AttributeName: session_id, KeyType: RANGE}]

  Usage:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: matrix-usage
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: project_id, AttributeType: S}, {AttributeName: ts_id, AttributeType: S}]
      KeySchema: [{AttributeName: project_id, KeyType: HASH}, {AttributeName: ts_id, KeyType: RANGE}]

  # Traces, learning drafts and agent state. aiops.py, autonomy.py, metrics.py and learning.py all need this table.
  TraceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: matrix-trace
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true


  # Runbooks (knowledge base), playbooks, Terraform modules, migration scratch space
  OpsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub matrix-ops-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true


  # console_api.py reads its own log group for traces. 14 days is what the code expects.
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: 14


  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: matrix-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !If [AttachViewOnly, 'arn:aws:iam::aws:policy/job-function/ViewOnlyAccess', !Ref 'AWS::NoValue']
        - !If [AttachReadOnly, 'arn:aws:iam::aws:policy/ReadOnlyAccess', !Ref 'AWS::NoValue']
      Policies:
        - PolicyName: matrix-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # --- logging, and the traces page reading the function's own log group ---
              - Sid: WriteOwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*
              - Sid: ReadOwnLogs
                Effect: Allow
                Action: [logs:FilterLogEvents, logs:GetLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*
              - Sid: ReadCodeBuildAndOtherLogs
                Effect: Allow
                Action: [logs:GetLogEvents, logs:StartQuery, logs:GetQueryResults, logs:DescribeLogGroups, logs:StopQuery]
                Resource: '*'
              # --- the autonomous agent starts its own long runs by invoking itself ---
              - Sid: InvokeSelf
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}
              # --- DynamoDB: trace table plus projects, sessions, usage (matrix-table.yaml) ---
              - Sid: Tables
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan, dynamodb:BatchWriteItem]
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/matrix-*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/matrix-*/index/*
              # --- ops bucket: runbooks, playbooks, Terraform modules, migration data ---
              - Sid: OpsBucketObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub ${OpsBucket.Arn}/*
              - Sid: OpsBucketList
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt OpsBucket.Arn
              # --- run commands and patching over SSM (no SSH), only on servers tagged matrix-managed ---
              - Sid: SendCommandToTaggedServers
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/matrix-managed: 'true'
              - Sid: SendCommandDocuments
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunPatchBaseline
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunAnsiblePlaybook
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/*
              - Sid: SsmRead
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:ListCommands
                  - ssm:DescribeInstanceInformation
                  - ssm:DescribeInstancePatches
                  - ssm:DescribeInstancePatchStates
                  - ssm:ListDocuments
                  - ssm:DescribeDocument
                  - ssm:GetDocument
                Resource: '*'
              # --- playbooks become SSM documents: MATRIX-LEARNED-* (learning) and MATRIX-PB-* (uploaded in the console) ---
              - Sid: UpdatePlaybookDocuments
                Effect: Allow
                Action:
                  - ssm:UpdateDocument
                  - ssm:UpdateDocumentDefaultVersion
                  - ssm:AddTagsToResource
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/MATRIX-LEARNED-*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/MATRIX-PB-*
              - Sid: CreatePlaybookDocuments
                Effect: Allow
                Action: [ssm:CreateDocument, ssm:AddTagsToResource]
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestTag/CreatedBy: [MATRIX-Learning, MATRIX-Console]
              # --- EC2: read, power actions on tagged servers, and the older migration tools ---
              - Sid: Ec2Read
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeImages
                  - ec2:DescribeSnapshots
                  - ec2:DescribeVolumes
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeAddresses
                  - ec2:DescribeTags
                Resource: '*'
              - Sid: Ec2Power
                Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances, ec2:RebootInstances]
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/matrix-managed: 'true'
              - Sid: Ec2MigrationAndSnapshots
                Effect: Allow
                Action: [ec2:CreateImage, ec2:CreateSnapshot, ec2:RunInstances, ec2:CreateTags]
                Resource: '*'
              - Sid: PassInstanceRoleOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/matrix-instance-role-*
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              # --- observability, alarms, load balancers, change history, cost ---
              - Sid: ObservabilityRead
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmHistory
                  - cloudtrail:LookupEvents
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeLoadBalancers
                  - ce:GetCostAndUsage
                Resource: '*'
              # --- Terraform deployments run as a CodeBuild project named matrix-* ---
              - Sid: TerraformBuilds
                Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/matrix-*
              # --- the scoped executor and decommission roles from matrix-iam-executor.yaml ---
              - Sid: AssumeScopedRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/matrix-executor-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/matrix-decommission-*
              - !If
                - HasOperatorRole
                - Sid: AssumeOperatorRole
                  Effect: Allow
                  Action: sts:AssumeRole
                  Resource: !Ref OperatorRoleArn
                - !Ref 'AWS::NoValue'

  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /matrix/executor-audit-${Environment}
      RetentionInDays: 365


  # Role that EC2 instances launched by the agent use, so SSM can manage them
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub matrix-instance-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy


  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub matrix-instance-profile-${Environment}
      Roles: [!Ref InstanceRole]


  # The role the agent assumes to run engineer-requested commands
  ExecutorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub matrix-executor-${Environment}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !GetAtt LambdaRole.Arn }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: matrix-executor-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # --- run commands, only on managed instances in this environment ---
              - Sid: SendCommandToTaggedInstances
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/matrix-managed: 'true'
                    ssm:resourceTag/environment: !Ref Environment
              - Sid: SendCommandDocuments
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunPatchBaseline
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/MATRIX_*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/NGINX_*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/KILL_PID
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/CPU_DIAGNOSTICS
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/DISK_*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/PROCESS_DETAILS
              - Sid: ReadCommandResults
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:ListCommands
                  - ssm:DescribeInstanceInformation
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeImages
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVolumes
                Resource: '*'
              - Sid: ReadObservability
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmHistory
                  - logs:DescribeLogGroups
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - cloudtrail:LookupEvents
                  - ec2:DescribeAddresses
                  - ec2:DescribeSnapshots
                  - ec2:DescribeNetworkInterfaces
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeLoadBalancers
                Resource: '*'
              - Sid: SnapshotTaggedVolumes
                Effect: Allow
                Action: ec2:CreateSnapshot
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:${AWS::Region}::snapshot/*
              - Sid: ReadLatestAmiParameter
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}::parameter/aws/service/ami-amazon-linux-latest/*
              # --- start / stop / reboot, tagged instances in this environment only ---
              - Sid: PowerActions
                Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances, ec2:RebootInstances]
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/matrix-managed: 'true'
                    aws:ResourceTag/environment: !Ref Environment
              # --- launch instances: approved types only, tags mandatory ---
              - Sid: RunInstancesOnInstance
                Effect: Allow
                Action: ec2:RunInstances
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:RequestTag/matrix-managed: 'true'
                    aws:RequestTag/environment: !Ref Environment
                  'Null':
                    aws:RequestTag/change: 'false'
              - Sid: RunInstancesSupportingResources
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                  - !Sub arn:aws:ec2:${AWS::Region}::image/*
              # --- backup images for patching, migration and decommission (no reboot), tagged instances only ---
              - Sid: CreateImageOfTaggedInstances
                Effect: Allow
                Action: ec2:CreateImage
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/matrix-managed: 'true'
                    aws:ResourceTag/environment: !Ref Environment
              - Sid: CreateImageOutputs
                Effect: Allow
                Action: ec2:CreateImage
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}::image/*
                  - !Sub arn:aws:ec2:${AWS::Region}::snapshot/*
                Condition:
                  StringEquals:
                    aws:RequestTag/matrix-managed: 'true'
                    aws:RequestTag/environment: !Ref Environment
                  'Null':
                    aws:RequestTag/change: 'false'
              # copy a migration image into another region (the same role must be created there too, see docs/deployment-guide.md)
              - Sid: CopyImage
                Effect: Allow
                Action: ec2:CopyImage
                Resource: !Sub arn:aws:ec2:${AWS::Region}::image/*
              # move an Elastic IP during migration cutover and rollback
              - Sid: MoveElasticIp
                Effect: Allow
                Action: [ec2:AssociateAddress, ec2:DisassociateAddress]
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/matrix-managed: 'true'
                    aws:ResourceTag/environment: !Ref Environment
              - Sid: MoveElasticIpResources
                Effect: Allow
                Action: [ec2:AssociateAddress, ec2:DisassociateAddress]
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*
              - Sid: TagOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:*/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: [RunInstances, CreateImage, CopyImage, CreateSnapshot]
              - Sid: TagImagesOnCreate
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}::image/*
                  - !Sub arn:aws:ec2:${AWS::Region}::snapshot/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: [CreateImage, CopyImage, CreateSnapshot]
              - Sid: PassInstanceRoleOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt InstanceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Sid: WriteAudit
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${AuditLogGroup.Arn}:*
              # --- hard stops, cannot be overridden by anything above ---
              - Sid: NeverAllow
                Effect: Deny
                Action:
                  - iam:*
                  - organizations:*
                  - account:*
                  - ec2:TerminateInstances
                  - ec2:DeleteVolume
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:ModifyInstanceAttribute
                  - kms:ScheduleKeyDeletion
                  - s3:DeleteBucket
                  - rds:DeleteDBInstance
                Resource: '*'
              # permission boundary on PassRole above; explicit deny of passing any other role
              - Sid: DenyPassOtherRoles
                Effect: Deny
                Action: iam:PassRole
                NotResource: !GetAtt InstanceRole.Arn


  # Optional: the ONLY way the agent can terminate. The main executor role keeps its hard deny on TerminateInstances.
  # Works only on instances that are matrix-managed, in this environment, AND tagged decommission-approved=true by a human.
  DecommissionRole:
    Type: AWS::IAM::Role
    Condition: DecomEnabled
    Properties:
      RoleName: !Sub matrix-decommission-${Environment}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !GetAtt LambdaRole.Arn }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: matrix-decommission-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TerminateApprovedInstancesOnly
                Effect: Allow
                Action: ec2:TerminateInstances
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/matrix-managed: 'true'
                    aws:ResourceTag/environment: !Ref Environment
                    aws:ResourceTag/decommission-approved: 'true'
              - Sid: Describe
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'


  # Structured service control, no free-form shell needed for start/stop/restart
  ServiceActionDoc:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_SERVICE_ACTION
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: Start, stop, restart or check a systemd service (allowlisted names only)
        parameters:
          ServiceName:
            type: String
            allowedPattern: '^(nginx|httpd|amazon-cloudwatch-agent|amazon-ssm-agent|crond|chronyd|sshd|docker|mysqld|postgresql|rsyslog)$'
          Action:
            type: String
            allowedValues: [start, stop, restart, status]
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'systemctl {{ Action }} {{ ServiceName }}'
                - 'systemctl is-active {{ ServiceName }} || true'

  MemDiagnostics:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_MEM_DIAGNOSTICS
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. Memory and swap usage, top memory processes, OOM kills
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'free -m'
                - 'ps aux --sort=-%mem | head -n 11'
                - 'dmesg 2>/dev/null | grep -i "out of memory" | tail -n 5 || true'


  CertExpiryCheck:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_CERT_EXPIRY_CHECK
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. Days left on the TLS certificate of a host:port
        parameters:
          Host: { type: String, default: localhost, allowedPattern: '^[A-Za-z0-9.-]{1,253}$' }
          Port: { type: String, default: '443', allowedPattern: '^[0-9]{2,5}$' }
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'echo | openssl s_client -servername {{ Host }} -connect {{ Host }}:{{ Port }} 2>/dev/null | openssl x509 -noout -enddate -subject'


  PortCheck:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_PORT_CHECK
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. Listening ports and established connection counts
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'ss -tulpn'
                - 'ss -s'


  LogCleanup:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_LOG_CLEANUP
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: MUTATING (needs approval). Remove rotated/compressed logs older than N days under /var/log, and vacuum the journal
        parameters:
          Days: { type: String, default: '14', allowedPattern: '^[0-9]{1,3}$' }
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'df -h /var/log'
                - 'find /var/log -type f \( -name "*.gz" -o -name "*.[0-9]" -o -name "*.old" \) -mtime +{{ Days }} -print -delete'
                - 'journalctl --vacuum-time={{ Days }}d'
                - 'df -h /var/log'


  BackupStatus:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_BACKUP_STATUS
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. Recent cron/backup job activity and disk usage of common backup paths
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'systemctl list-timers --all --no-pager | head -n 20'
                - 'grep -i backup /var/log/cron* 2>/dev/null | tail -n 20 || true'
                - 'df -h'


  PatchScan:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_PATCH_SCAN
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. List available security updates (dnf)
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'dnf updateinfo list security 2>/dev/null | head -n 50 || yum updateinfo list security | head -n 50'


  NetCheck:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_NET_CHECK
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. DNS lookup and TCP connect test from the instance to host:port
        parameters:
          Host: { type: String, allowedPattern: '^[A-Za-z0-9.-]{1,253}$' }
          Port: { type: String, default: '443', allowedPattern: '^[0-9]{2,5}$' }
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'case "{{ Host }}" in 169.254.*|127.*) echo "blocked address"; exit 1;; esac'
                - 'getent hosts {{ Host }} || echo "DNS lookup failed"'
                - 'timeout 5 bash -c "</dev/tcp/{{ Host }}/{{ Port }}" && echo "TCP {{ Host }}:{{ Port }} OPEN" || echo "TCP {{ Host }}:{{ Port }} FAILED"'


  Overview:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_OVERVIEW
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. One-shot health snapshot (load, memory, disk, inodes, failed units, last errors)
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'uptime; echo; free -m; echo; df -h; echo; df -i | head -n 8; echo'
                - 'systemctl --failed --no-pager | head -n 15; echo'
                - 'journalctl -p err -n 15 --no-pager'


  LargeFiles:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_LARGE_FILES
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. Largest files under a path (default /var)
        parameters:
          Path: { type: String, default: /var, allowedPattern: '^/(var|tmp|home|opt|srv|data)[A-Za-z0-9_/.-]{0,100}$' }
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'du -ahx {{ Path }} 2>/dev/null | sort -rh | head -n 20'


  LogTail:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_LOG_TAIL
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. Last N lines of an allowlisted log file
        parameters:
          LogFile: { type: String, allowedPattern: '^/var/log/(messages|syslog|secure|cron|dmesg|nginx/[a-z_.]+|httpd/[a-z_.]+|amazon/ssm/[A-Za-z0-9_.-]+|amazon-cloudwatch-agent/[A-Za-z0-9_.-]+)$' }
          Lines: { type: String, default: '100', allowedPattern: '^[0-9]{1,3}$' }
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'tail -n {{ Lines }} {{ LogFile }}'

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: python3.12
      Handler: lambda_function.handler
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt LambdaRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      LoggingConfig:
        LogGroup: !Sub /aws/lambda/${FunctionName}
      Environment:
        Variables:
          SN_BASE: !Ref SnBase
          SN_USER: !Ref SnUser
          SN_PASS: !Ref SnPass
          SN_AI_USER: !Ref SnAiUser
          SN_AI_GROUP: !Ref SnAiGroup
          SN_L2_GROUP: !Ref SnL2Group
          SN_L3_GROUP: !Ref SnL3Group
          L1_GROUP: !Ref L1Group
          L2_GROUP: !Ref L2Group
          TOKEN_SECRET: !Ref TokenSecret
          USERS: !Ref UsersJson
          LEAD_ROLES: !Ref LeadRoles
          AGENT_KEY: !Ref AgentKey
          ALLOWED_ORIGIN: !Ref WebsiteUrl
          OPENAI_URL: !Ref LlmUrl
          OPENAI_API_KEY: !Ref LlmApiKey
          OPENAI_MODEL: !Ref LlmModel
          LLM_SMALL_MODEL: !Ref LlmSmallModel
          LLM_EXTRA_MODELS: !Ref LlmExtraModels
          LLM_FALLBACK_URL: !Ref Fb1Url
          LLM_FALLBACK_KEY: !Ref Fb1Key
          LLM_FALLBACK_MODEL: !Ref Fb1Model
          LLM_FALLBACK_URL_2: !Ref Fb2Url
          LLM_FALLBACK_KEY_2: !Ref Fb2Key
          LLM_FALLBACK_MODEL_2: !Ref Fb2Model
          LLM_FALLBACK_URL_3: !Ref Fb3Url
          LLM_FALLBACK_KEY_3: !Ref Fb3Key
          LLM_FALLBACK_MODEL_3: !Ref Fb3Model
          ENVIRONMENT: !Ref Environment
          EXECUTOR_ROLE_ARN: !GetAtt ExecutorRole.Arn
          DECOMMISSION_ROLE_ARN: !If [DecomEnabled, !GetAtt DecommissionRole.Arn, '']
          INSTANCE_PROFILE: !Ref InstanceProfile
          SUBNET_ID: !Ref SubnetId
          SECURITY_GROUP_ID: !Ref SecurityGroupId
          AUDIT_LOG_GROUP: !Ref AuditLogGroup
          OPS_BUCKET: !Ref OpsBucket
          TRACE_TABLE: !Ref TraceTable
          OPERATOR_ROLE_ARN: !Ref OperatorRoleArn
          MAX_VCPU: !Ref MaxVcpu
          ALLOWED_TYPES: !Ref AllowedTypes
          SERVICES: !Ref Services
          INGEST_URL: !Ref IngestUrl
          TF_PROJECT: !Ref TfProject
          TF_MODULES: !Ref TfModules
          PLAYBOOKS: !Ref Playbooks
          KB_NAME: !Ref KbName
          LLM_PRICES: !Ref LlmPrices
          AUTO_AFTER: !Ref AutoAfter
          FAMILIES: !Ref Families
          RAG_MIN: !Ref RagMin
          RAG_REQUIRED: !Ref RagRequired
          EVAL_HOST: !Ref EvalHost


  # The console signs users in itself (token), so the URL itself is open and CORS limits the browser origin.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: [!Ref WebsiteUrl]
        AllowMethods: ['*']
        AllowHeaders: [content-type, authorization]
        MaxAge: 86400


  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE


  UrlInvokeViaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true


  # Starts the automatic learning scan every 5 minutes
  LearnScanRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${FunctionName}-learn-scan
      Description: MATRIX learning scan of resolved, escalated incidents
      ScheduleExpression: rate(5 minutes)
      State: !Ref LearnScan
      Targets:
        - Id: matrix-learn-scan
          Arn: !GetAtt Function.Arn
          Input: '{"matrix_task":"learn_scan"}'


  LearnScanPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LearnScanRule.Arn

Outputs:
  LambdaRoleArn:
    Value: !GetAtt LambdaRole.Arn
    Description: Use as TrustedLambdaRoleArn in the executor stack and as the role in the app stack
  TraceTableName:
    Value: !Ref TraceTable
  OpsBucketName:
    Value: !Ref OpsBucket
  LogGroupName:
    Value: !Ref LogGroup
  ExecutorRoleArn:
    Value: !GetAtt ExecutorRole.Arn
  InstanceProfileName:
    Value: !Ref InstanceProfile
  AuditLogGroupName:
    Value: !Ref AuditLogGroup
  DecommissionRoleArn:
    Condition: DecomEnabled
    Value: !GetAtt DecommissionRole.Arn
    Description: Put this in the Lambda variable DECOMMISSION_ROLE_ARN to let the agent terminate approved instances
  FunctionUrl:
    Value: !GetAtt FunctionUrl.FunctionUrl
    Description: Paste this into the console sign-in page as the Lambda Function URL
  FunctionArn:
    Value: !GetAtt Function.Arn
