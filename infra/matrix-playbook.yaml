AWSTemplateFormatVersion: '2010-09-09'
Description: MATRIX additional SSM playbooks. Read-only ones can run automatically; mutating ones need approval.

Resources:
  MemDiagnostics:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_MEM_DIAGNOSTICS
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. Memory and swap usage, top memory processes, OOM kills
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'free -m'
                - 'ps aux --sort=-%mem | head -n 11'
                - 'dmesg 2>/dev/null | grep -i "out of memory" | tail -n 5 || true'

  CertExpiryCheck:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_CERT_EXPIRY_CHECK
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. Days left on the TLS certificate of a host:port
        parameters:
          Host: { type: String, default: localhost, allowedPattern: '^[A-Za-z0-9.-]{1,253}$' }
          Port: { type: String, default: '443', allowedPattern: '^[0-9]{2,5}$' }
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'echo | openssl s_client -servername {{ Host }} -connect {{ Host }}:{{ Port }} 2>/dev/null | openssl x509 -noout -enddate -subject'

  PortCheck:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_PORT_CHECK
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. Listening ports and established connection counts
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'ss -tulpn'
                - 'ss -s'

  LogCleanup:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_LOG_CLEANUP
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: MUTATING (needs approval). Remove rotated/compressed logs older than N days under /var/log, and vacuum the journal
        parameters:
          Days: { type: String, default: '14', allowedPattern: '^[0-9]{1,3}$' }
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'df -h /var/log'
                - 'find /var/log -type f \( -name "*.gz" -o -name "*.[0-9]" -o -name "*.old" \) -mtime +{{ Days }} -print -delete'
                - 'journalctl --vacuum-time={{ Days }}d'
                - 'df -h /var/log'

  BackupStatus:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_BACKUP_STATUS
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. Recent cron/backup job activity and disk usage of common backup paths
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'systemctl list-timers --all --no-pager | head -n 20'
                - 'grep -i backup /var/log/cron* 2>/dev/null | tail -n 20 || true'
                - 'df -h'

  PatchScan:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_PATCH_SCAN
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. List available security updates (dnf)
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'dnf updateinfo list security 2>/dev/null | head -n 50 || yum updateinfo list security | head -n 50'

  NetCheck:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_NET_CHECK
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. DNS lookup and TCP connect test from the instance to host:port
        parameters:
          Host: { type: String, allowedPattern: '^[A-Za-z0-9.-]{1,253}$' }
          Port: { type: String, default: '443', allowedPattern: '^[0-9]{2,5}$' }
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'case "{{ Host }}" in 169.254.*|127.*) echo "blocked address"; exit 1;; esac'
                - 'getent hosts {{ Host }} || echo "DNS lookup failed"'
                - 'timeout 5 bash -c "</dev/tcp/{{ Host }}/{{ Port }}" && echo "TCP {{ Host }}:{{ Port }} OPEN" || echo "TCP {{ Host }}:{{ Port }} FAILED"'

  Overview:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_OVERVIEW
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. One-shot health snapshot (load, memory, disk, inodes, failed units, last errors)
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'uptime; echo; free -m; echo; df -h; echo; df -i | head -n 8; echo'
                - 'systemctl --failed --no-pager | head -n 15; echo'
                - 'journalctl -p err -n 15 --no-pager'

  LargeFiles:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_LARGE_FILES
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. Largest files under a path (default /var)
        parameters:
          Path: { type: String, default: /var, allowedPattern: '^/(var|tmp|home|opt|srv|data)[A-Za-z0-9_/.-]{0,100}$' }
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'du -ahx {{ Path }} 2>/dev/null | sort -rh | head -n 20'

  LogTail:
    Type: AWS::SSM::Document
    Properties:
      Name: MATRIX_LOG_TAIL
      DocumentType: Command
      DocumentFormat: JSON
      Content:
        schemaVersion: '2.2'
        description: READ-ONLY. Last N lines of an allowlisted log file
        parameters:
          LogFile: { type: String, allowedPattern: '^/var/log/(messages|syslog|secure|cron|dmesg|nginx/[a-z_.]+|httpd/[a-z_.]+|amazon/ssm/[A-Za-z0-9_.-]+|amazon-cloudwatch-agent/[A-Za-z0-9_.-]+)$' }
          Lines: { type: String, default: '100', allowedPattern: '^[0-9]{1,3}$' }
        mainSteps:
          - action: aws:runShellScript
            name: run
            inputs:
              runCommand:
                - 'tail -n {{ Lines }} {{ LogFile }}'
