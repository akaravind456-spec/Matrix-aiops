<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MATRIX · Autonomous SRE</title>
<style>
:root{--bg:#F7F8FA;--card:#fff;--tx:#202124;--mu:#737780;--bd:#E7E9ED;--ac:#4C5FD5;--acs:#EEF0FB;--ok:#2F8F5B;--wa:#B7791F;--er:#C53030;--sh:0 1px 2px rgba(16,24,40,.05)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px/1.45 Inter,Geist,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}#app{display:none;height:100%}
aside{width:208px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;position:fixed;inset:0 auto 0 0}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 18px;font-weight:650;letter-spacing:.2px}.brand small{display:block;font-weight:400;color:var(--mu);font-size:11px;margin-top:-2px}
nav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--mu);cursor:pointer;text-align:left;margin-bottom:2px}
nav button:hover{background:var(--bg);color:var(--tx)}nav button.on{background:var(--acs);color:var(--ac);font-weight:600}nav svg{width:18px;height:18px;flex:none}
nav .n{margin-left:auto;background:var(--er);color:#fff;border-radius:9px;font-size:11px;padding:0 6px}
.me{margin-top:auto;border-top:1px solid var(--bd);padding:12px 8px 0;font-size:12px;color:var(--mu)}.me button{border:0;background:none;color:var(--ac);padding:0;cursor:pointer;margin-top:4px}
/* chat sidebar: New chat + history, only on the Chat page */
#chatside{display:flex;flex-direction:column;min-height:0;flex:1;border-top:1px solid var(--bd);margin:10px 0 8px;padding-top:12px}
#chatside[hidden]{display:none}
.nc{width:100%;display:flex;align-items:center;justify-content:center;gap:6px}
.hl{font-size:11px;color:var(--mu);font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin:16px 8px 4px}
#hist{flex:1;overflow:auto;min-height:0}
.hg{font-size:11px;color:var(--mu);margin:10px 8px 3px}
.hi{display:flex;align-items:center;border-radius:8px;cursor:pointer;color:var(--mu)}
.hi:hover{background:var(--bg);color:var(--tx)}.hi.on{background:var(--acs);color:var(--ac)}
.hi .tt{flex:1;min-width:0;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi .x{border:0;background:none;color:var(--mu);cursor:pointer;padding:4px 8px;opacity:0;font-size:15px;line-height:1}
.hi:hover .x{opacity:1}.hi .x:hover{color:var(--er)}
.eh{color:var(--mu);font-size:12px;padding:6px 10px}
main{margin-left:208px;padding:26px 32px;min-height:100%}h1{font-size:20px;margin:0 0 2px;font-weight:650}.sub{color:var(--mu);margin:0 0 18px}
h3{font-size:13px;margin:22px 0 8px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;box-shadow:var(--sh)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.k{font-size:26px;font-weight:650;line-height:1.1}.mu{color:var(--mu)}.s{font-size:12px}.kl{color:var(--mu);font-size:12px;margin-top:4px}
.btn{border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}.btn.o{background:none;color:var(--ac)}.btn.r{background:none;border-color:var(--er);color:var(--er)}.btn.sm{padding:3px 9px;font-size:12px}.btn[disabled]{opacity:.4;cursor:not-allowed}
input,select,textarea{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:7px 10px}textarea{width:100%}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:600;color:var(--mu);font-size:12px;padding:8px;border-bottom:1px solid var(--bd)}td{padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}tr.c{cursor:pointer}tr.c:hover{background:var(--bg)}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;background:var(--acs);color:var(--ac)}.chip.ok{background:#E8F5EE;color:var(--ok)}.chip.wa{background:#FBF1DC;color:var(--wa)}.chip.er{background:#FBE9E9;color:var(--er)}
.warn{background:#FBF1DC;color:#7A5200;border:1px solid #F0DDB0;border-radius:10px;padding:10px 14px;margin-bottom:12px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:6px 0;max-height:260px;overflow:auto;font-size:12px}
#chat{max-width:760px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 52px)}#msgs{flex:1;overflow:auto;padding:6px 2px}
.m{margin:10px 0;display:flex}.m.u{justify-content:flex-end}.m>div{max-width:86%;padding:9px 13px;border-radius:12px;white-space:pre-wrap}.m.u>div{background:var(--ac);color:#fff}.m.a>div{background:var(--card);border:1px solid var(--bd)}
.md{white-space:normal;overflow-x:auto}.md p{margin:0 0 8px}.md p:last-child{margin:0}.md ul,.md ol{margin:4px 0 8px 20px;padding:0}.md h4{margin:8px 0 4px;font-size:14px}.md table{border-collapse:collapse;margin:6px 0;font-size:13px}.md th,.md td{border:1px solid var(--bd);padding:4px 8px;text-align:left;vertical-align:top}.md th{background:var(--bg)}.md code{background:var(--bg);padding:1px 4px;border-radius:4px;font-size:12px}
.cf{margin-top:8px;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:var(--bg)}
#comp{display:flex;gap:8px;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:8px;box-shadow:var(--sh)}#comp textarea{border:0;resize:none;outline:0;flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.chips button{border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:5px 12px;cursor:pointer;color:var(--mu)}.chips button:hover{border-color:var(--ac);color:var(--ac)}
.wf{position:relative;height:22px;margin:3px 0}.wf i{position:absolute;top:3px;height:16px;border-radius:4px;background:var(--ac);opacity:.85}.wf i.t{background:#2F8F5B}.wf i.e{background:var(--er)}.wf span{position:absolute;left:0;font-size:11px;color:var(--mu);top:3px;z-index:1}
#lg{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}#lg .card{width:340px}#lg input{display:block;width:100%;margin:8px 0}
#ts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px}.ts{background:var(--tx);color:#fff;padding:9px 14px;border-radius:8px;max-width:340px}
</style></head><body>
<div id="lg"><div class="card"><div class="brand" style="padding-bottom:10px"><span id="logo0"></span>MATRIX</div><input id="lapi" placeholder="Lambda Function URL"><input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"><button class="btn" style="width:100%" onclick="login()">Sign in</button><p id="le" style="color:var(--er)"></p></div></div>
<div id="app"><aside><div class="brand"><span id="logo1"></span><div>MATRIX<small>Autonomous SRE</small></div></div><nav id="nav"></nav>
<div id="chatside" hidden><button class="btn nc" onclick="newChat()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New chat</button><div class="hl">Chat history</div><div id="hist"></div></div>
<div class="me"><div id="who"></div><button onclick="signout()">Sign out</button></div></aside><main id="main"></main></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOGO='<svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#4C5FD5"/><path d="M8 22V10l8 8 8-8v12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="9" r="2" fill="#fff"/></svg>';
$('#logo0').innerHTML=LOGO;$('#logo1').innerHTML=LOGO;
const IC={chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.6A8 8 0 1 1 21 12z"/>',obs:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',dash:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',kb:'<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h10"/>'};
const NAV=[['dash','Dashboard'],['chat','Chat'],['obs','Observability'],['kb','Knowledge']];
let API=localStorage.getItem('mx_api')||'',TOK=sessionStorage.getItem('mx_tok')||'',USER=JSON.parse(sessionStorage.getItem('mx_user')||'null'),view=sessionStorage.getItem('mx_view')||'dash',S={appr:[],inbox:[],inc:[],learn:0,ov:{}},DS={},timer=null,days=7;
if(view==='agent')view='dash';
let sessions=[],cur=null,msgs=[],M={},busy=false;
async function api(a,p={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({action:a,token:TOK,...p})});if(r.status===401){signout();throw Error('Session expired')}return r.json()}
function toast(x,go){const d=document.createElement('div');d.className='ts';d.textContent=x;if(go){d.style.cursor='pointer';d.title='Click to open';d.onclick=()=>{go();d.remove()}}$('#ts').appendChild(d);setTimeout(()=>d.remove(),go?12000:5000)}
async function login(){API=$('#lapi').value.trim();localStorage.setItem('mx_api',API);try{const r=await api('login',{username:$('#lu').value.trim().toLowerCase(),password:$('#lp').value});if(!r.ok){$('#le').textContent=r.error;return}TOK=r.token;USER=r.user;sessionStorage.setItem('mx_tok',TOK);sessionStorage.setItem('mx_user',JSON.stringify(USER));start()}catch(e){$('#le').textContent='Could not reach the API: '+e.message}}
function signout(){sessionStorage.clear();TOK='';sessions=[];cur=null;msgs=[];M={};clearInterval(timer);$('#lg').style.display='grid';$('#app').style.display='none'}
function start(){$('#lg').style.display='none';$('#app').style.display='block';$('#who').textContent=USER.name;loadH();newChat(true);poll();clearInterval(timer);timer=setInterval(poll,15000);go(view)}
function go(v){if(busy&&v!=='chat')toast('MATRIX is still answering. Wait a moment.');view=v;sessionStorage.setItem('mx_view',v);paintNav();({dash,chat,obs,kb})[v]()}
function paintNav(){$('#nav').innerHTML=NAV.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${l}${k==='dash'&&S.appr.length?`<span class="n">${S.appr.length}</span>`:''}${k==='kb'&&S.learn?`<span class="n">${S.learn}</span>`:''}</button>`).join('');$('#chatside').hidden=view!=='chat';if(view==='chat')paintHist()}
const KIND_LABEL={escalation:'Escalated: ',approval:'Approval needed: ',learning:'Knowledge: ',incident:'New incident: '};
async function poll(){try{const [a,i,l]=await Promise.all([api('approvals'),api('inbox'),api('learn_stats').catch(()=>({}))]);const old=new Set(S.inbox.map(x=>x.sk));if(S.inbox.length)(i.inbox||[]).filter(x=>!old.has(x.sk)&&x.kind!=='resolved').forEach(x=>toast((KIND_LABEL[x.kind]||'')+x.text,x.kind==='learning'?()=>go('kb'):null));S.appr=a.approvals||[];S.inbox=i.inbox||[];S.learn=l.pending||0;paintNav();if(view==='dash'&&DS.list)dashPaint();if(view==='kb'&&S.learnSeen!==S.learn){S.learnSeen=S.learn;kLoad()}}catch(e){}}
const hd=(t,s)=>`<h1>${t}</h1><p class="sub">${s}</p>`,fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n),sec=ms=>ms>=1000?(ms/1000).toFixed(1)+' s':ms+' ms';
const usd=v=>'$'+(v>0&&v<1?v.toFixed(4):v.toFixed(2));
const kpi=(v,l,x='')=>`<div class="card"><div class="k">${v}</div><div class="kl">${l}</div>${x?`<div class="s mu">${x}</div>`:''}</div>`;
const chip=(t,c='')=>`<span class="chip ${c}">${esc(t)}</span>`,SC={resolved:'ok',escalated:'er',pending:'wa',assigned:'',investigating:''};
/* ---- tiny SVG charts ---- */
function line(v,h=130){if(!v.length)return'<div class="mu s">No data yet</div>';const w=560,mx=Math.max(...v,1),st=w/Math.max(v.length-1,1),p=v.map((y,i)=>(i?'L':'M')+(i*st).toFixed(1)+' '+(h-14-(y/mx)*(h-28)).toFixed(1)).join(' ');return`<svg viewBox="0 0 ${w} ${h}" width="100%"><path d="${p}" fill="none" stroke="#4C5FD5" stroke-width="2"/><text x="0" y="12" font-size="11" fill="#737780">max ${sec(mx)}</text></svg>`}
function cols(d,keys,colors,h=130){if(!d.length)return'<div class="mu s">No data yet</div>';const w=560,mx=Math.max(...d.map(x=>keys.reduce((a,k)=>a+(x[k]||0),0)),1),bw=Math.min(40,w/d.length-8);return`<svg viewBox="0 0 ${w} ${h+16}" width="100%">`+d.map((x,i)=>{let y=h,xx=i*(w/d.length)+4;return keys.map((k,j)=>{const hh=(x[k]||0)/mx*(h-16);y-=hh;return`<rect x="${xx}" y="${y}" width="${bw}" height="${hh}" rx="3" fill="${colors[j]}"/>`}).join('')+`<text x="${xx}" y="${h+13}" font-size="10" fill="#737780">${esc(x.day)}</text>`}).join('')+'</svg>'}
function hbars(d,lab,val,color='#4C5FD5',f=fmt){const mx=Math.max(...d.map(x=>x[val]),1);return d.map(x=>`<div style="margin:6px 0"><div class="s" style="display:flex;justify-content:space-between"><span>${esc(x[lab])}</span><span class="mu">${f(x[val])}</span></div><div style="background:var(--bg);border-radius:4px;height:8px"><div style="width:${x[val]/mx*100}%;background:${color};height:8px;border-radius:4px"></div></div></div>`).join('')||'<div class="mu s">No data yet</div>'}
function dayPick(fn){return`<select onchange="days=+this.value;${fn}()"><option value="1" ${days==1?'selected':''}>Last 24 hours</option><option value="7" ${days==7?'selected':''}>Last 7 days</option><option value="30" ${days==30?'selected':''}>Last 30 days</option></select>`}
const periodName=()=>days==1?'last 24 hours':'last '+days+' days';
/* ---- DASHBOARD (agent activity + results + cost, one page) ---- */
async function dash(){$('#main').innerHTML=hd('Dashboard','What MATRIX is doing, what needs you, how it is performing and what it costs')+'<div class="mu">Loading…</div>';await dashLoad()}
async function dashLoad(){const r=await Promise.allSettled([api('list'),api('dash',{days}),api('cost',{days}),api('llm_cost',{days}),api('license')]);const v=x=>x.status==='fulfilled'?x.value:{ok:false,error:x.reason.message};DS={list:v(r[0]),dash:v(r[1]),cost:v(r[2]),llm:v(r[3]),lic:v(r[4])};if(DS.list.ok){S.inc=DS.list.incidents;ovApply()}if(view==='dash')dashPaint()}
const pr=n=>'$'+(+n).toFixed(Math.abs(n*100-Math.round(n*100))>1e-9?3:2);
const priceTxt=m=>m.price_in==null?'<span style="color:var(--wa)">price not set</span>':(m.price_in===0&&m.price_out===0?'free':pr(m.price_in)+' / '+pr(m.price_out));
function licBlock(){const l=DS.lic||{};if(!l.ok)return l.error&&l.error!=='unknown action'?`<div class="s mu" style="margin:0 0 10px">Licence usage unavailable: ${esc(l.error)}</div>`:'';
 const row=(t,x)=>`<div><span class="kl">${t}</span> <b>${x.used}</b> of ${x.limit==null?'unlimited':x.limit}${x.state==='over'?' <span style="color:var(--wa)">over the limit</span>':x.state==='near'?' <span style="color:var(--wa)">close to the limit</span>':''}</div>`;
 return`<h3>Licence</h3><div class="card" style="margin-bottom:14px"><div class="k" style="font-size:18px">${l.licensed?esc(l.plan.charAt(0).toUpperCase()+l.plan.slice(1))+(l.name?' · '+esc(l.name):''):'Evaluation'}</div>
 ${l.licensed?row('Managed servers',l.servers)+row('Approver seats',l.seats):`<div class="s mu">No licence plan is set. ${l.servers.used} managed server${l.servers.used===1?'':'s'} and ${l.seats.used} user${l.seats.used===1?'':'s'} in use.</div>`}
 ${l.status!=='ok'&&l.licensed?'<div class="warn" style="margin:8px 0 0">Usage is at or over the plan limit. Nothing is blocked. Talk to your account owner about a capacity pack or the next plan.</div>':''}</div>`}
function costBlock(){const c=DS.cost||{},o=DS.llm||{};const llm=o.ok?o.total:0,unk=o.ok?(o.unknown||[]).length:0;
 const rows=o.ok?(o.rows||[]).map(m=>`<tr><td>${esc(m.model)}</td><td>${m.calls}</td><td>${fmt(m.in||0)} / ${fmt(m.out||0)}</td><td class="s">${priceTxt(m)}${m.note?`<div class="mu">${esc(m.note)}</div>`:''}</td><td>${m.cost==null?'–':usd(m.cost)}</td></tr>`).join(''):'';
 const aws=c.ok?c.total:0,total=aws+llm;
 const credit=c.ok&&c.credits<-0.0001?`<div class="s mu">Credits of ${usd(-c.credits)} apply, so you pay ${usd(c.net_total)}.</div>`:'';
 const awsErr=c.ok?'':`<div class="warn" style="margin:8px 0 0">${esc(c.error==='unknown action'?'AWS cost is not set up yet. Add matrix_cost_action to the Lambda, then refresh.':c.error||'Could not load AWS costs.')}</div>`;
 const n=(c.daily||[]).length,step=Math.max(1,Math.ceil(n/7)),daily=(c.daily||[]).map((x,i)=>({day:i%step===0?x.d.slice(5):'',aws:x.v}));
 return licBlock()+`<h3>Cost so far · ${periodName()}</h3><div class="g2"><div class="card"><div class="k">${c.ok||o.ok?usd(total):'No data'}</div><div class="kl">AWS ${c.ok?usd(aws):'unavailable'} + LLM ${o.ok?usd(llm):'unavailable'}${unk?` <span style="color:var(--wa)">(+ ${unk} model${unk>1?'s':''} with no price)</span>`:''}</div>${credit}
 ${c.ok?`<div class="s mu" style="margin:14px 0 4px"><b>AWS spend per day</b> · all services, before credits · the latest day is usually incomplete</div>${cols(daily,['aws'],['#4C5FD5'])}<div class="s mu" style="margin:12px 0 2px"><b>By AWS service</b> · ${(c.services||[]).length} with charges. Services inside the free tier cost nothing and are not listed.</div>${hbars((c.services||[]).map(s=>({s:s.name,v:s.v})),'s','v','#4C5FD5',usd)}`:awsErr}</div>
 <div class="card"><b>LLM usage</b><div class="s mu" style="margin-bottom:6px">Tokens from the agent's own traces times each model's price. Prices are kept on the server (setting LLM_PRICES).</div>${o.ok?`<table><tr><th>Model</th><th>Calls</th><th>Tokens in / out</th><th>Price per 1M in / out</th><th>Cost</th></tr>${rows||'<tr><td class="mu" colspan="5">No LLM calls in this period</td></tr>'}</table>`:`<div class="warn">${esc(o.error||'Could not load LLM usage.')}</div>`}</div></div>`}
function dashPaint(){if(view!=='dash')return;const L=(DS.list||{}).incidents||[],d=DS.dash||{},seen=new Set(),esc_=S.inbox.filter(x=>x.kind==='escalation'&&!seen.has(x.number)&&seen.add(x.number)&&(L.find(i=>i.number===x.number)||{}).status==='escalated'),mine=L.filter(i=>i.status==='assigned'),none=d.ok&&d.resolved+d.escalated===0,st=Object.entries(d.incident_status||{}).map(([k,v])=>({s:k,v}));
 const snErr=!(DS.list||{}).ok?(DS.list||{}).error:(d.incident_error||'');
 $('#main').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start">${hd('Dashboard','What MATRIX is doing, what needs you, how it is performing and what it costs')}<div>${dayPick('dash')} <button class="btn o sm" onclick="dash()">Refresh</button></div></div>
${snErr?`<div class="warn"><b>ServiceNow is not connected.</b> Incidents, runbooks and ticket checks will not work until it is fixed. ${esc(snErr).slice(0,260)}</div>`:''}
<div class="grid">${kpi(S.appr.length,'Waiting for your approval')}${kpi(esc_.length,'Escalated to L2')}${kpi(L.filter(i=>i.status!=='resolved').length,'Open incidents')}${kpi(d.ok?d.resolved:'–','Resolved by the agent')}${kpi(d.ok?(d.auto_rate==null?'No data':d.auto_rate+'%'):'–','Autonomous resolution rate',none?'Needs at least one finished incident':'')}${kpi(d.ok?(d.human_rate==null?'No data':d.human_rate+'%'):'–','Human intervention rate','Escalated to L2')}${kpi(d.ok?(d.mttr_min==null?'No data':d.mttr_min+' min'):'–','Average time to resolve')}</div>
${costBlock()}
<h3>Needs your approval</h3>${S.appr.map(a=>`<div class="card" style="margin-bottom:8px"><b>${esc(a.number)}</b> on ${esc(a.host)}<div>${esc(a.summary)}</div><div class="mu s">${esc(a.reason||'')}</div><div style="margin-top:8px"><button class="btn sm" onclick="decide('${esc(a.sk)}',true)">Approve</button> <button class="btn r sm" onclick="decide('${esc(a.sk)}',false)">Reject</button></div></div>`).join('')||'<div class="mu">Nothing waiting.</div>'}
<h3>Escalated to L2</h3>${esc_.map(x=>`<div class="card" style="margin-bottom:8px"><b>${esc(x.number)}</b> ${chip('Escalated','er')}<div class="mu s">${esc(x.text)}</div><div style="margin-top:8px"><button class="btn sm" onclick="take('${esc(x.number)}')">Take ownership</button> <button class="btn o sm" onclick="resolveI('${esc(x.number)}')">Resolve</button></div></div>`).join('')||'<div class="mu">No escalations.</div>'}

 while(i<L.length){const l=L[i];
  if(/^\s*```/.test(l)){if(fence){o.push('<pre>'+code.join('\n')+'</pre>');code=[];fence=false}else fence=true;i++;continue}
  if(fence){code.push(l);i++;continue}
  if(/^\s*\|/.test(l)&&i+1<L.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1])&&/-/.test(L[i+1])){const h=cells(l);i+=2;const rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(cells(L[i]));i++}

  let m;
  if(m=l.match(/^\s*#{1,4}\s+(.*)$/)){o.push('<h4>'+inl(m[1])+'</h4>');i++;continue}
  if(/^\s*[-*•]\s+/.test(l)){const it=[];while(i<L.length&&/^\s*[-*•]\s+/.test(L[i])){it.push(L[i].replace(/^\s*[-*•]\s+/,''));i++}o.push('<ul>'+it.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>');continue}
  if(/^\s*\d+[.)]\s+/.test(l)){const it=[];while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i])){it.push(L[i].replace(/^\s*\d+[.)]\s+/,''));i++}o.push('<ol>'+it.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ol>');continue}
  if(!l.trim()){i++;continue}
  const para=[];while(i<L.length&&L[i].trim()&&!/^\s*(\||#{1,4}\s|[-*•]\s|\d+[.)]\s|```)/.test(L[i])){para.push(inl(L[i]));i++}o.push('<p>'+para.join('<br>')+'</p>')}

function kPaint(){if(!$('#kr0'))return;const L=K.learn||{},ds=L.drafts||[],pend=ds.filter(d=>d.status==='pending'),busy=ds.filter(d=>d.status==='drafting'||d.status==='publishing'),ok=ds.filter(d=>d.status==='approved').length,no=ds.filter(d=>d.status==='rejected').length;
 $('#kr0').innerHTML=`<h3>Waiting for your review${pend.length?' · '+pend.length:''}</h3>`+(L.ok===false?`<div class="warn">${esc(L.error||'Could not load learning drafts.')}</div>`:(pend.map(learnCard).join('')+busy.map(d=>`<div class="card" style="margin-bottom:8px"><b>${esc(d.title||d.number)}</b> ${chip(d.status==='drafting'?'Drafting…':'Publishing…','wa')}</div>`).join('')||'<div class="mu">Nothing waiting. When a ticket the agent escalated gets resolved, MATRIX drafts a knowledge article and a playbook here for you to approve.</div>')+((ok||no)?`<div class="s mu" style="margin-top:6px">${ok} approved, ${no} rejected so far.</div>`:''));
 pend.filter(d=>d.blocked||d.blocks>0).forEach(d=>kDraft(d.number));
 const s=K.snow||{};$('#ksn').innerHTML=s.ok?'<tr><th>Number</th><th>Title</th><th>Knowledge base</th><th>State</th><th>Updated</th></tr>'+((s.articles||[]).map(a=>`<tr class="c" onclick="kSV('${esc(a.number)}')"><td>${esc(a.number)}</td><td>${esc(a.title)}</td><td class="mu">${esc(a.kb)}</td><td>${chip(a.state||'–',/publish/i.test(a.state)?'ok':'wa')}</td><td class="mu">${esc(a.updated)}</td></tr>`).join('')||'<tr><td class="mu" colspan="5">No articles yet</td></tr>'):`<tr><td class="s" style="color:var(--er)">${esc(s.error||'The ServiceNow knowledge base could not be read')}</td></tr>`;
 const w=K.ssm||{};$('#kaw').innerHTML=w.ok?'<tr><th>Name</th><th>Origin</th><th>Type</th><th>Version</th><th>Created</th></tr>'+((w.docs||[]).map(x=>`<tr class="c" onclick="kAV('${esc(x.name)}')"><td>${esc(x.name)}</td><td class="mu">${esc(x.origin)}</td><td class="mu">${esc(x.type)} · ${esc(x.format)}</td><td class="mu">${esc(x.version)}</td><td class="mu">${esc(x.created)}</td></tr>`).join('')||'<tr><td class="mu" colspan="5">No documents yet</td></tr>'):`<tr><td class="s" style="color:var(--er)">${esc(w.error||'AWS documents could not be read')}</td></tr>`}
async function kSV(n){const r=await api('snow_kb_get',{number:n}),e=$('#kv');e.hidden=false;e.textContent=r.ok?r.number+'  '+r.title+'\n\n'+r.text:r.error;e.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function kAV(n){const r=await api('ssm_doc_get',{name:n}),e=$('#kd');e.hidden=false;e.textContent=r.ok?r.name+'  (version '+r.version+', '+r.format+')\n\n'+r.text:r.error;e.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function kDraft(n){const r=await api('learn_get',{id:n}),e=$('#kd_'+n);if(!e)return;if(!r.ok){toast(r.error);return}e.innerHTML=`<div class="s mu" style="margin-top:8px">Approving publishes the article to the ServiceNow knowledge base${r.playbook?' and creates an AWS Systems Manager document from the playbook':' (this draft has no playbook)'}.</div>${(r.checks||[]).map(c=>`<div class="s" style="color:${c.level==='block'?'var(--er)':c.level==='warn'?'var(--wa)':'var(--ok)'}">${c.level==='ok'?'✓':c.level==='warn'?'!':'✕'} ${esc(c.text)}</div>`).join('')}<pre>${esc(r.article||'')}</pre>${r.playbook?`<div class="s mu">Playbook (AWS document)</div><pre>${esc(JSON.stringify(r.playbook,null,1))}</pre>`:''}`}
async function kDecide(n,dec){let comment='';if(dec==='changes'){comment=prompt('What should change in this draft?');if(!comment)return}toast('Working…');let r;try{r=await api('learn_decide',{id:n,decision:dec,comment})}catch(e){return toast(e.message)}toast((r.text||r.error||'').slice(0,240));poll();kLoad()}
async function kS(){const r=await api('kb_search',{q:$('#ks').value});$('#kr').innerHTML=(r.hits||[]).map(h=>`<pre><b>${esc(h.doc)}</b> · confidence ${Math.round(h.confidence*100)}%\n${esc(h.text)}</pre>`).join('')||'<div class="mu s" style="margin-top:6px">No match: the agent would escalate this.</div>'}
$('#lapi').value=API;if(TOK&&USER&&API)start();
</script></body></html>
